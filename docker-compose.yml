version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  user-service:
    build: ./backend/user-service
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_users?authSource=admin
      - PORT=3001
    depends_on:
      - mongodb

  product-service:
    build: ./backend/product-service
    ports:
      - "3002:3002"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_products?authSource=admin
      - PORT=3002
    depends_on:
      - mongodb

  cart-service:
    build: ./backend/cart-service
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_carts?authSource=admin
      - PORT=3003
    depends_on:
      - mongodb

  order-service:
    build: ./backend/order-service
    ports:
      - "3004:3004"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_orders?authSource=admin
      - PORT=3004
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service

volumes:
  mongodb_data:
